<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2e7d32">
  <title>Panier Pesé</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🧺 Panier Pesé</h1>
    <p id="total-mois" class="total-mois"></p>
  </header>

  <!-- Navigation : 4 boutons, chaque data-onglet pointe vers une <section> -->
  <nav>
    <button data-onglet="saisir" class="actif">Saisir</button>
    <button data-onglet="historique">Historique</button>
    <button data-onglet="bilan">Bilan</button>
    <button data-onglet="reglages">Réglages</button>
  </nav>

  <main>

    <!-- ============ ONLET 1 : SAISIE EXPRESS ============ -->
    <section id="onglet-saisir">
      <form id="form-depense" class="carte">

        <!-- id caché : rempli uniquement quand on MODIFIE une dépense existante -->
        <input type="hidden" id="champ-id">

        <label for="champ-montant">Montant (€)</label>
        <!-- inputmode="decimal" → clavier numérique sur Android -->
        <input id="champ-montant" type="number" inputmode="decimal"
               step="0.01" min="0" placeholder="0,00" required>

        <!-- Chips : les catégories les plus utilisées, en un tap -->
        <p id="chips-categories" class="chips"></p>

        <label for="champ-categorie">Catégorie</label>
        <select id="champ-categorie" required></select>

        <label for="champ-date">Date</label>
        <input id="champ-date" type="date" required>

        <label for="champ-note">Note (facultative)</label>
        <input id="champ-note" type="text" maxlength="80"
               placeholder="ex : Intermarché, boulangerie…">

        <button type="submit" id="bouton-valider" class="bouton">Ajouter la dépense</button>

        <!-- ====== Simulation ticket — deviendra le vrai bouton photo en V2 ====== -->
        <button type="button" id="bouton-simu-ticket" class="bouton secondaire">
          📷 Simuler un ticket (V2)
        </button>
        
        <button type="button" id="bouton-annuler" class="bouton secondaire" hidden>
          Abandonner la modification
        </button>
      </form>
    </section>

    <!-- ============ ONGLET 2 : HISTORIQUE ============ -->
    <section id="onglet-historique" hidden>
      <input id="champ-recherche" type="search"
             placeholder="Rechercher (catégorie, note)…">
      <div id="liste-depenses"></div>
    </section>

    <!-- ============ ONGLET 3 : BILAN ============ -->
    <section id="onglet-bilan" hidden>

      <div class="carte">
        <div id="segmente-periode" class="segmente">
          <button type="button" data-mode="mois-courant" class="actif">Ce mois-ci</button>
          <button type="button" data-mode="un-mois">Un mois précis</button>
          <button type="button" data-mode="plage">Entre deux mois</button>
          <button type="button" data-mode="tout">Depuis le début</button>
        </div>

        <div id="choix-un-mois" hidden>
          <label for="select-bilan-mois">Mois</label>
          <select id="select-bilan-mois"></select>
        </div>

        <div id="choix-plage" hidden>
          <label for="select-bilan-debut">Du mois</label>
          <select id="select-bilan-debut"></select>
          <label for="select-bilan-fin">Au mois</label>
          <select id="select-bilan-fin"></select>
        </div>

        <p id="libelle-periode" class="libelle-periode"></p>
      </div>

      <div id="bilan-contenu"></div>
    </section>

    <!-- ============ ONGLET 4 : RÉGLAGES ============ -->
    <section id="onglet-reglages" hidden>

      <div class="carte">
        <h2>Catégories</h2>
        <div id="liste-categories"></div>

        <details>
          <summary>Ajouter une catégorie</summary>
          <form id="form-categorie">
            <label for="champ-nom-categorie">Nom</label>
            <input id="champ-nom-categorie" type="text" maxlength="40" required>
            <label for="champ-groupe-categorie">Groupe</label>
            <select id="champ-groupe-categorie" required></select>
            <button type="submit" class="bouton">Ajouter</button>
          </form>
        </details>
      </div>

      <div class="carte">
        <h2>Sauvegarde</h2>
        <p id="info-export" class="info"></p>
        <button id="bouton-export-json" class="bouton">Exporter tout (JSON)</button>
        <button id="bouton-export-csv" class="bouton secondaire">Exporter pour Excel (CSV)</button>
        <button id="bouton-importer" class="bouton secondaire"
                onclick="document.getElementById('champ-import').click()">
          Importer un export JSON
        </button>
        <input type="file" id="champ-import" accept=".json,application/json" hidden>
      </div>

      <div class="carte">
        <h2>Préférences</h2>
        <label for="select-pref-mois">« Ce mois-ci » désigne…</label>
        <select id="select-pref-mois">
          <option value="calendaire">Le mois calendaire (du 1er au dernier jour)</option>
          <option value="glissant">Le mois glissant (du même jour du mois dernier à aujourd'hui)</option>
        </select>
      </div>

      <div class="carte">
        <h2>Zone de danger</h2>
        <!-- ====== Outils de test — À RETIRER en version finale ====== -->
        <button id="bouton-jeu-test" class="bouton secondaire">
          Installer un jeu de test (≈150 dépenses, 6 mois)
        </button>
        <button id="bouton-purge-test" class="bouton secondaire">
          Retirer les données de test
        </button>
        <!-- ====== fin outils de test ====== -->
        <button id="bouton-reinit" class="bouton danger">Effacer toutes les données</button>
      </div>

    </section>

    <!-- ============ ONGLET (hors nav) : SIMULATION TICKET V2 ============ -->
        <section id="onglet-simulation" hidden>
      <div class="carte">
        <h2 id="simu-titre">Ticket simulé</h2>
        <p id="simu-info" class="info"></p>
        <div id="simu-groupes"></div>

        <!-- Sélecteur : uniquement les catégories existantes (mode création/édition) -->
        <div id="simu-picker" class="carte" hidden>
          <p class="info">Catégorie pour « <strong id="simu-picker-label"></strong> »</p>
          <div id="simu-picker-liste" class="chips"></div>
          <button id="simu-picker-fermer" class="bouton secondaire">Annuler</button>
        </div>

        <button id="bouton-simu-valider" class="bouton">Valider le ticket</button>
        <button id="bouton-simu-modifier" class="bouton" hidden>✏️ Modifier ce ticket</button>
        <button id="bouton-simu-supprimer" class="bouton danger" hidden>🗑️ Supprimer ce ticket</button>
        <button id="bouton-simu-abandonner" class="bouton secondaire">Retour</button>
      </div>
    </section>

  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
